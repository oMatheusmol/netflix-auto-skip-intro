<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; width: 240px; padding: 8px; }
    label { display: block; margin: 8px 0; }
    input[type=number] { width: 70px; }
  </style>
</head>
<body>
  <label><input type="checkbox" id="autoClick"> Auto-click "Skip Intro", "Skip Recap" and "Next Episode"</label>
  <label><input type="checkbox" id="skipStart"> Skip ahead at the start of every episode</label>
  <label>Seconds: <input type="number" id="skipSeconds" min="0" step="5"></label>
  <script src="popup.js"></script>
</body>
</html>
